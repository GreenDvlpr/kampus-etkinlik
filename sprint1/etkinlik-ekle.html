<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Etkinlik Ekle</title>
</head>
<body>

    <h1>Etkinlik Ekle</h1>
    
    <nav>
        <a href="index.html">Ana Sayfa</a> 
        <a href="etkinlik-ekle.html">Ekle</a> 
        <a href="etkinlik-guncelle.html">Güncelle</a>
    </nav>

    <br>

    <form action="#" method="get">
        <label for="etkinlikAdi">Etkinlik Adı</label><br>
        <input type="text" id="etkinlikAdi" name="etkinlikAdi" required><br><br>

        <label for="kategori">Kategori</label><br>
        <select id="kategori" name="kategori" required>
            <option value="Seminer">Seminer</option>
            <option value="Atolye">Atölye</option>
        </select><br><br>

        <label for="tarih">Tarih</label><br>
        <input type="text" id="tarih" name="tarih" placeholder="gg.aa.yyyy" required><br><br>

        <label for="aciklama">Açıklama</label><br>
        <textarea id="aciklama" name="aciklama" required></textarea><br><br>

        <input type="submit" value="Kaydet">
    </form>

</body>
</html>
