<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Etkinlik Güncelle</title>
</head>
<body>

    <h1>Etkinlik Güncelle</h1>
    
    <nav>
        <a href="index.html">Ana Sayfa</a> 
        <a href="etkinlik-ekle.html">Ekle</a> 
        <a href="etkinlik-guncelle.html">Güncelle</a>
    </nav>

    <br>

    <form action="#" method="get">
        <label for="etkinlikAdi">Etkinlik Adı</label><br>
        <!-- value niteliği ile veri dolu gelir -->
        <input type="text" id="etkinlikAdi" name="etkinlikAdi" value="Kariyer Günleri" required><br><br>

        <label for="kategori">Kategori</label><br>
        <select id="kategori" name="kategori" required>
            <option value="Seminer" selected>Seminer</option>
            <option value="Atolye">Atölye</option>
        </select><br><br>

        <label for="tarih">Tarih</label><br>
        <input type="text" id="tarih" name="tarih" value="12.10.2026" required><br><br>

        <label for="aciklama">Açıklama</label><br>
        <!-- textarea etiketinde veri, iki etiket arasına yazılır -->
        <textarea id="aciklama" name="aciklama" required>Mezun söyleşileri</textarea><br><br>

        <input type="submit" value="Güncelle">
    </form>

</body>
</html>
